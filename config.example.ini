; Modelo sem segredos. O arquivo real deve ficar fora da pasta do projeto.
; Padrao: %LOCALAPPDATA%\AutoCusto\config.ini
; Alternativa: AUTO_CUSTO_CONFIG com caminho absoluto.
[Base]
Servidor=
Porta=1433
Banco=
Usuario=
Senha=
; Linux: ODBC 18, criptografia obrigatoria e validacao de certificado por padrao.
NomeCertificadoServidor=
; Manter 0. Usar 1 somente com autorizacao explicita de excecao temporaria.
ConfiarCertificadoServidor=0

[Seguranca]
; Gerar chave aleatoria de pelo menos 32 bytes. Nao publicar a chave real.
; AUTO_CUSTO_JWT_SECRET tem prioridade sobre este campo.
JwtSecret=
